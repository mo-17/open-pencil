name: CI

on:
  pull_request:
    branches: [master, lowcode-rebaseline]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Fetch comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Select validation scope
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun tools/ci/src/classify.ts

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! bun run check:commits --from "$BASE_SHA" --to "$HEAD_SHA" --verbose; then
            echo '::error title=Commit messages::Check the messages listed above. Use type(scope): description, for example fix: preserve selection. See CONTRIBUTING.md#commit-messages.'
            exit 1
          fi

  documentation:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Build documentation type dependencies
        run: bun run build:packages
      - name: Validate documentation and generated references
        run: bun run check:docs
      - name: Build documentation and check examples
        run: bun run docs:build

  source-quality:
    name: Code quality
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate package declarations
        run: bun run build:packages

      - name: Verify formatting
        run: bun run format:check

      - name: Lint TypeScript and Vue
        run: bun run lint

      - name: Typecheck application and SDKs
        run: bun run typecheck

      - name: Enforce architecture and type-shape boundaries
        run: bun run check:arch && bun run test:type-shapes

  package-quality:
    name: Package integrity
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Cache npm consumer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-consumers-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: npm-consumers-${{ runner.os }}-

      - name: Build publishable packages
        run: bun run build:packages

      - name: Validate installed package artifacts with Node and Bun
        run: bun run test:packages

      - name: Smoke Compiler Backend public export
        run: bun --filter @open-pencil/compiler smoke:dist

      - name: Detect unused dependencies and files
        run: bun run check:deps

      - name: Validate workspace dependency policy
        run: bun run check:monorepo

  repository-quality:
    name: Repository hygiene
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Validate translations
        run: bun run check:i18n

      - name: Validate documentation links and structure
        run: bun run check:docs

      - name: Audit critical dependency vulnerabilities
        run: bun run check:audit

      - name: Test repository tooling
        run: bun run test:tools

      - name: Detect duplicated product code
        run: bun run test:dupes

  storybook:
    name: Component workshop
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build component dependencies
        run: bun run build:packages

      - name: Build static Storybook
        run: bun run build-storybook

  native-test-contracts:
    name: Native app contracts
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/open-pencil/native-contracts-ci@sha256:64e6b1b50a988c1cefe2b69ac9d58076fd743b18391fa2dbd1d153eba2be9521
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: native-test

      - uses: ./.github/actions/setup-bun

      - name: Typecheck native interaction tests
        run: bun run check:native-test

      - name: Compile native-test Tauri feature
        run: cargo check --manifest-path desktop/Cargo.toml --features native-test

  unit-tests:
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [app, compiler, compiler-browser, dom, editor, fig, motion, render, scene, vue]
    name: Unit tests — ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Install Chromium for compiler browser tests
        if: matrix.group == 'compiler-browser'
        run: bunx playwright install --with-deps chromium

      - name: Build shared Core test dependency
        if: matrix.group != 'compiler' && matrix.group != 'compiler-browser'
        run: bun --filter @open-pencil/core build

      - name: Build compiler test dependencies
        if: startsWith(matrix.group, 'compiler')
        run: bun run build:packages

      - name: Run ${{ matrix.group }} unit tests
        run: bun tools/unit-tests/src/run.ts "${{ matrix.group }}"
        env:
          BUN_HEAVY_TESTS: 'false'

      - name: Run Vue source Worker browser E2E
        if: matrix.group == 'compiler-browser'
        run: >-
          bunx playwright test tests/e2e/export/vue-source-worker.spec.ts
          --project=openpencil --workers=1 --timeout=90000 --trace=retain-on-failure

      - name: Run Preview target and bridge app E2E
        if: matrix.group == 'compiler-browser'
        run: >-
          bunx playwright test tests/e2e/code/preview-pane-tauri.spec.ts
          --project=openpencil --workers=1 --timeout=90000 --trace=retain-on-failure

  p2-motion-e2e:
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    name: P2 Motion Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build Node-side Motion test dependency
        run: bun --filter @open-pencil/scene-graph build

      - name: Install Chromium and ffprobe
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run P2 Motion browser tests
        run: |
          bunx playwright test \
            tests/e2e/properties/motion-panel.spec.ts \
            tests/e2e/properties/motion-path-editor.spec.ts \
            tests/e2e/export/basic.spec.ts \
            --project=openpencil \
            --workers=1 \
            --timeout=30000 \
            --trace=retain-on-failure
        env:
          OPENPENCIL_MCP_SOCKET: ${{ runner.temp }}/open-pencil-motion-e2e.sock
          OPENPENCIL_MCP_DISCOVERY_PATH: ${{ runner.temp }}/open-pencil-motion-e2e.json

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2-motion-playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-tests:
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    name: Desktop Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install Tauri test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run desktop unit tests
        run: cargo test --manifest-path desktop/Cargo.toml --locked

      - name: Check release OAuth Broker path
        env:
          VITE_GOOGLE_DRIVE_CLIENT_ID: 1234567890-ci.apps.googleusercontent.com
          VITE_ONEDRIVE_CLIENT_ID: 11111111-2222-4333-8444-555555555555
          OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN: https://oauth-broker.example.com
          VITE_ALIYUN_DRIVE_CLIENT_ID: aliyun-ci-public-client
          OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN: https://aliyun-oauth-broker.example.com
          OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI: http://127.0.0.1:53682/oauth/aliyun-drive/callback
          VITE_BAIDU_NETDISK_APP_KEY: baidu_ci_public_key
          OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN: https://baidu-oauth-broker.example.com
        run: cargo check --manifest-path desktop/Cargo.toml --locked --release

  result:
    name: CI result
    needs:
      [
        changes,
        commit-messages,
        documentation,
        source-quality,
        package-quality,
        repository-quality,
        storybook,
        native-test-contracts,
        unit-tests,
        p2-motion-e2e,
        desktop-tests
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Require successful checks for the selected scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun tools/ci/src/gate.ts
