name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'open-pencil/open-pencil'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bunRuntimeCache: bun-darwin-aarch64
            nativeSmoke: true
            nativeSidecar: false
            appleSigning: true
            bunDownloadUrl: ''
            manualBundleArgs: ''
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            bunRuntimeCache: bun-darwin-x64-baseline
            nativeSmoke: true
            nativeSidecar: false
            appleSigning: true
            bunDownloadUrl: ''
            manualBundleArgs: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bunRuntimeCache: bun-windows-x64-baseline
            nativeSmoke: true
            nativeSidecar: true
            appleSigning: false
            bunDownloadUrl: https://github.com/oven-sh/bun/releases/download/bun-v1.3.10/bun-windows-x64-baseline.zip
            bunExecutableSha256: a26e4e47c3b1d59e7cff711795778d95531457eac2a7104ba25a17fcb0225774
            bunExpectedArch: x64
            bunVersion: 1.3.10
            manualBundleArgs: ''
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            bunRuntimeCache: bun-windows-aarch64
            nativeSmoke: true
            nativeSidecar: true
            appleSigning: false
            bunDownloadUrl: https://github.com/oven-sh/bun/releases/download/bun-v1.3.10/bun-windows-aarch64.zip
            bunExecutableSha256: 96db0e1941cb923cd9f776647fad9571f9e6041d6454ea8ca1d18d7d38697274
            bunExpectedArch: arm64
            bunVersion: 1.3.10
            manualBundleArgs: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bunRuntimeCache: bun-linux-x64-baseline
            nativeSmoke: true
            nativeSidecar: false
            appleSigning: false
            bunDownloadUrl: ''
            manualBundleArgs: --bundles deb,rpm

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$VERSION_CODENAME" = jammy

          ubuntu_sources="$RUNNER_TEMP/openpencil-ubuntu.list"
          cat > "$ubuntu_sources" <<'EOF'
          deb https://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb https://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF

          apt_options=(
            -o "Dir::Etc::sourcelist=$ubuntu_sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o DPkg::Lock::Timeout=60
          )
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" NEEDRESTART_MODE="$NEEDRESTART_MODE" \
            apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" NEEDRESTART_MODE="$NEEDRESTART_MODE" \
            apt-get "${apt_options[@]}" install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: ./.github/actions/setup-bun
        with:
          bun-download-url: ${{ matrix.bunDownloadUrl }}

      - name: Verify native Windows Bun runtime
        if: matrix.nativeSidecar
        shell: bash
        env:
          EXPECTED_BUN_ARCH: ${{ matrix.bunExpectedArch }}
          EXPECTED_BUN_SHA256: ${{ matrix.bunExecutableSha256 }}
          EXPECTED_BUN_VERSION: ${{ matrix.bunVersion }}
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$EXPECTED_BUN_VERSION"
          test "$(bun -p 'process.platform')" = "win32"
          test "$(bun -p 'process.arch')" = "$EXPECTED_BUN_ARCH"
          bun_path="$(cygpath -u "$(bun -p 'process.execPath')")"
          actual_sha256="$(sha256sum "$bun_path" | awk '{ print $1 }')"
          test "$actual_sha256" = "$EXPECTED_BUN_SHA256"

      - name: Verify Marketplace release contracts
        run: bun test tests/engine/marketplace && bun --filter @open-pencil/marketplace build

      - name: Build and verify CodePen sidecar
        shell: bash
        env:
          CODEPEN_BUN_RUNTIME_CACHE_NAME: ${{ matrix.bunRuntimeCache }}
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/codepen-sidecar-build.log"
          sidecar_args=(--target=${{ matrix.target }})
          if [[ "${{ matrix.nativeSidecar }}" == "true" ]]; then
            sidecar_args+=(--native-runtime)
          fi
          if ! bun run build:codepen-sidecar "${sidecar_args[@]}" 2>&1 | tee "$build_log"; then
            bun_version="$(bun --version)"
            expected_error="Failed to extract executable for '${CODEPEN_BUN_RUNTIME_CACHE_NAME}-v${bun_version}'. The download may be incomplete."
            if ! grep -Fq -- "$expected_error" "$build_log"; then
              exit 1
            fi
            if [[ ! "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
              echo "Refusing to clear a Bun runtime cache entry for an invalid version." >&2
              exit 1
            fi
            cache_entry="$HOME/.bun/install/cache/${CODEPEN_BUN_RUNTIME_CACHE_NAME}-v${bun_version}"
            case "$cache_entry" in
              "$HOME"/.bun/install/cache/*) ;;
              *)
                echo "Refusing to clear a Bun runtime cache entry outside the install cache." >&2
                exit 1
                ;;
            esac
            echo "Retrying after clearing the incomplete runtime cache entry."
            rm -rf -- "$cache_entry"
            sleep 5
            bun run build:codepen-sidecar "${sidecar_args[@]}"
          fi
          bun run build:codepen-sidecar --target=${{ matrix.target }} --verify-only

      - name: Smoke CodePen sidecar protocol
        if: matrix.nativeSmoke
        run: bun run smoke:codepen-sidecar --target=${{ matrix.target }}

      - name: Extract release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          bun tools/release-packages/src/extract-release-notes.ts "$VERSION" "$NOTES_FILE"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_notes<<$EOF" >> "$GITHUB_OUTPUT"
          cat "$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Validate cloud storage OAuth desktop build configuration
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN }}
          VITE_ALIYUN_DRIVE_CLIENT_ID: ${{ vars.VITE_ALIYUN_DRIVE_CLIENT_ID }}
          OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN }}
          OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI: ${{ vars.OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI }}
          VITE_BAIDU_NETDISK_APP_KEY: ${{ vars.VITE_BAIDU_NETDISK_APP_KEY }}
          OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN }}
        run: |
          bun -e '
            const clientId = process.env.VITE_GOOGLE_DRIVE_CLIENT_ID ?? "";
            if (!/^[A-Za-z0-9_-]{10,200}\.apps\.googleusercontent\.com$/.test(clientId)) {
              throw new Error("VITE_GOOGLE_DRIVE_CLIENT_ID must be a Google Desktop OAuth client ID");
            }
            const oneDriveClientId = process.env.VITE_ONEDRIVE_CLIENT_ID ?? "";
            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(oneDriveClientId)) {
              throw new Error("VITE_ONEDRIVE_CLIENT_ID must be a Microsoft Entra application client ID");
            }
            const origin = process.env.OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN ?? "";
            let parsed;
            try { parsed = new URL(origin); } catch {
              throw new Error("OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN must be a canonical HTTPS origin");
            }
            if (parsed.protocol !== "https:" || parsed.origin !== origin || parsed.pathname !== "/" || parsed.search || parsed.hash || parsed.username || parsed.password) {
              throw new Error("OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN must be a canonical HTTPS origin");
            }
            const requirePublicIdentifier = (name, pattern, description) => {
              const value = process.env[name] ?? "";
              if (!pattern.test(value)) throw new Error(`${name} must be ${description}`);
            };
            const requireHttpsOrigin = (name) => {
              const value = process.env[name] ?? "";
              let url;
              try { url = new URL(value); } catch {
                throw new Error(`${name} must be a canonical HTTPS origin`);
              }
              if (url.protocol !== "https:" || url.origin !== value || url.pathname !== "/" || url.search || url.hash || url.username || url.password) {
                throw new Error(`${name} must be a canonical HTTPS origin`);
              }
            };
            requirePublicIdentifier("VITE_ALIYUN_DRIVE_CLIENT_ID", /^[A-Za-z0-9._~-]{6,200}$/, "a public Aliyun Drive OAuth client ID");
            requireHttpsOrigin("OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN");
            const aliyunRedirect = process.env.OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI ?? "";
            let redirect;
            try { redirect = new URL(aliyunRedirect); } catch {
              throw new Error("OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI must be a fixed 127.0.0.1 loopback callback URI");
            }
            const redirectPort = Number(redirect.port);
            if (redirect.protocol !== "http:" || redirect.hostname !== "127.0.0.1" || !Number.isInteger(redirectPort) || redirectPort < 1024 || redirectPort > 65535 || redirect.pathname !== "/oauth/aliyun-drive/callback" || redirect.search || redirect.hash || redirect.username || redirect.password || redirect.href !== aliyunRedirect) {
              throw new Error("OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI must be an exact http://127.0.0.1:<1024-65535>/oauth/aliyun-drive/callback URI");
            }
            requirePublicIdentifier("VITE_BAIDU_NETDISK_APP_KEY", /^[A-Za-z0-9_-]{6,128}$/, "a public Baidu OAuth App Key");
            requireHttpsOrigin("OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN");
          '

      - name: Build unsigned Tauri workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN }}
          VITE_ALIYUN_DRIVE_CLIENT_ID: ${{ vars.VITE_ALIYUN_DRIVE_CLIENT_ID }}
          OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN }}
          OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI: ${{ vars.OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI }}
          VITE_BAIDU_NETDISK_APP_KEY: ${{ vars.VITE_BAIDU_NETDISK_APP_KEY }}
          OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN }}
          OPENPENCIL_CODEPEN_SIDECAR_PREBUILT: '1'
        with:
          tauriScript: bunx tauri
          args: >-
            --target ${{ matrix.target }}
            --no-sign
            --config desktop/tauri.unsigned.conf.json
            ${{ matrix.manualBundleArgs }}

      - name: Upload unsigned Tauri workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-pencil-${{ matrix.label }}-${{ github.run_attempt }}
          path: desktop/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build signed Tauri release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_GOOGLE_DRIVE_OAUTH_BROKER_ORIGIN }}
          VITE_ALIYUN_DRIVE_CLIENT_ID: ${{ vars.VITE_ALIYUN_DRIVE_CLIENT_ID }}
          OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_ALIYUN_DRIVE_OAUTH_BROKER_ORIGIN }}
          OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI: ${{ vars.OPENPENCIL_ALIYUN_DRIVE_REDIRECT_URI }}
          VITE_BAIDU_NETDISK_APP_KEY: ${{ vars.VITE_BAIDU_NETDISK_APP_KEY }}
          OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN: ${{ vars.OPENPENCIL_BAIDU_NETDISK_OAUTH_BROKER_ORIGIN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ matrix.appleSigning && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.appleSigning && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.appleSigning && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.appleSigning && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.appleSigning && secrets.APPLE_TEAM_ID || '' }}
          OPENPENCIL_CODEPEN_SIDECAR_PREBUILT: '1'
        with:
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.release_notes }}
          releaseDraft: true
          includeUpdaterJson: true

      - name: Verify signed macOS CodePen sidecar
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          (startsWith(matrix.target, 'aarch64-apple-') || startsWith(matrix.target, 'x86_64-apple-'))
        shell: bash
        run: |
          app_path="desktop/target/${{ matrix.target }}/release/bundle/macos/OpenPencil.app"
          sidecar_path="$app_path/Contents/MacOS/openpencil-codepen-sidecar"
          codesign --verify --deep --strict "$app_path"
          codesign --verify --strict "$sidecar_path"
          bun run smoke:codepen-sidecar --target=${{ matrix.target }} --binary="$sidecar_path"

  prepare-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'mo-17/open-pencil'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_digest: ${{ steps.release_digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org/

      - name: Verify exact Node.js runtime
        run: test "$(node --version)" = "v24.19.0"

      - uses: ./.github/actions/setup-bun
        with:
          cache: 'false'

      - name: Build packages for publish
        shell: bash
        run: bun run build:packages

      - name: Prepare publish directories
        shell: bash
        run: |
          set -euo pipefail
          bun tools/release-packages/src/prepare-publish-dirs.ts
          find .publish -maxdepth 3 -type f | sort

      - name: Validate prepared package metadata
        shell: bash
        env:
          OPENPENCIL_PACKAGE_ROOT: .publish
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "Prerelease tags require an explicit npm dist-tag policy" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs')
          const plan = require('./.publish/release-plan.json')
          const expectedRepository = 'git+https://github.com/mo-17/open-pencil.git'
          if (
            plan.version !== process.env.RELEASE_VERSION ||
            plan.repository !== expectedRepository ||
            plan.packages.length !== 14
          ) {
            throw new Error(`Prepared release plan does not match v${process.env.RELEASE_VERSION}`)
          }
          const positions = new Map(plan.packages.map((item, index) => [item.name, index]))
          const directories = new Set(plan.packages.map(({ dir }) => dir))
          if (positions.size !== plan.packages.length || directories.size !== plan.packages.length) {
            throw new Error('Prepared release plan contains duplicate packages')
          }
          for (const [index, item] of plan.packages.entries()) {
            const manifest = JSON.parse(fs.readFileSync(`.publish/${item.dir}/package.json`, 'utf8'))
            if (
              item.version !== plan.version ||
              manifest.name !== item.name ||
              manifest.version !== item.version
            ) {
              throw new Error(`${item.dir}: prepared manifest identity does not match release plan`)
            }
            if (item.name !== `@open-pencil-lowcode/${item.dir}`) {
              throw new Error(`${item.dir}: unexpected publish name ${item.name}`)
            }
            for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
              for (const dependencyName of Object.keys(manifest[field] ?? {})) {
                const dependencyIndex = positions.get(dependencyName)
                if (dependencyIndex !== undefined && dependencyIndex >= index) {
                  throw new Error(
                    `Release plan must publish ${dependencyName} before ${item.name}`
                  )
                }
              }
            }
          }
          const mcpIndex = positions.get('@open-pencil-lowcode/mcp')
          const cliIndex = positions.get('@open-pencil-lowcode/cli')
          if (mcpIndex === undefined || cliIndex === undefined || mcpIndex >= cliIndex) {
            throw new Error('Release plan must publish MCP before CLI')
          }
          NODE
          bun tools/package-quality/src/check/metadata.ts
          bun tools/package-quality/src/check/publint.ts
          bun tools/package-quality/src/check/attw.ts

      - name: Pack and audit release tarballs
        id: release_digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-release
          root_dir="$PWD"
          publish_packages=$(node -p "require('./.publish/release-plan.json').packages.map(({ dir }) => dir).join(' ')")
          for dir in $publish_packages; do
            (cd ".publish/${dir}" && npm pack --pack-destination "$root_dir/npm-release")
          done
          bun tools/release-packages/src/validate-tarballs.ts npm-release .publish/release-plan.json
          cp .publish/release-plan.json npm-release/release-plan.json
          shasum -a 512 npm-release/release-plan.json npm-release/*.tgz > npm-release/SHA512SUMS
          release_digest=$(shasum -a 256 npm-release/SHA512SUMS | awk '{print $1}')
          printf 'digest=%s\n' "$release_digest" >> "$GITHUB_OUTPUT"

      - name: Smoke audited npm tarball consumers
        shell: bash
        env:
          OPENPENCIL_PACKAGE_ROOT: .publish
          OPENPENCIL_PACKAGE_TARBALL_ROOT: npm-release
        run: |
          set -euo pipefail
          bun tools/package-quality/src/smoke.ts

      - name: Upload audited npm release artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}
          path: npm-release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'mo-17/open-pencil'
    needs: prepare-npm
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download audited npm release artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}
          path: npm-release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org/

      - name: Verify exact Node.js runtime
        run: test "$(node --version)" = "v24.19.0"

      - name: Verify npm Trusted Publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          NPM_VERSION="$npm_version" node <<'NODE'
          const raw = process.env.NPM_VERSION ?? ''
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(raw)
          if (!match) {
            throw new Error(`Cannot verify npm version for Trusted Publishing: ${raw || '<empty>'}`)
          }
          const [major, minor, patch] = match.slice(1).map(Number)
          if (
            major < 11 ||
            (major === 11 && minor < 5) ||
            (major === 11 && minor === 5 && patch < 1)
          ) {
            throw new Error(`npm ${raw} is too old; Trusted Publishing requires npm >=11.5.1`)
          }
          NODE
          echo "Verified npm ${npm_version} supports Trusted Publishing"

      - name: Verify downloaded release artifact
        shell: bash
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.prepare-npm.outputs.release_digest }}
        run: |
          set -euo pipefail
          actual_release_digest=$(shasum -a 256 npm-release/SHA512SUMS | awk '{print $1}')
          if [ "$actual_release_digest" != "$EXPECTED_RELEASE_DIGEST" ]; then
            echo "Downloaded npm release artifact digest does not match the preparation job" >&2
            exit 1
          fi
          shasum -a 512 -c npm-release/SHA512SUMS
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          node <<'NODE'
          const fs = require('node:fs')
          const plan = require('./npm-release/release-plan.json')
          const actual = fs.readdirSync('npm-release').sort()
          const expected = [
            'SHA512SUMS',
            'release-plan.json',
            ...plan.packages.map(
              ({ name, version }) =>
                `${name.replace(/^@/, '').replaceAll('/', '-')}-${version}.tgz`
            )
          ].sort()
          if (plan.version !== process.env.RELEASE_VERSION || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Downloaded npm release artifact does not match the tag or release plan')
          }
          NODE

      - name: Publish packages to npm
        # BOOTSTRAP ONLY: NPM_TOKEN must be a short-lived granular token used solely to
        # create packages that do not exist yet. After the first successful publish,
        # configure npm Trusted Publishers for mo-17/open-pencil + build.yml and the
        # npm-production environment, delete the repository secret, and remove this env
        # block plus the bootstrap auth branch.
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          readonly NPM_REGISTRY=https://registry.npmjs.org/
          if [ -n "${NPM_BOOTSTRAP_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
            unset NPM_BOOTSTRAP_TOKEN
            echo "Using temporary npm bootstrap token authentication"
            npm whoami --registry "$NPM_REGISTRY" >/dev/null
          else
            unset NODE_AUTH_TOKEN NPM_BOOTSTRAP_TOKEN
            echo "Using npm Trusted Publishing (OIDC)"
          fi

          registry_state() {
            local name=$1
            local version=$2
            local output
            if output=$(npm view "${name}@${version}" version --registry "$NPM_REGISTRY" 2>&1); then
              if [ "$output" != "$version" ]; then
                echo "Registry returned unexpected version for ${name}@${version}: ${output}" >&2
                exit 1
              fi
              REGISTRY_STATE=exists
            elif [[ "$output" == *"E404"* ]]; then
              REGISTRY_STATE=missing
            else
              echo "npm registry lookup failed for ${name}@${version}" >&2
              echo "$output" >&2
              exit 1
            fi
          }
          publish_packages=$(node -p "require('./npm-release/release-plan.json').packages.map(({ dir }) => dir).join(' ')")
          for dir in $publish_packages; do
            name=$(node -p "require('./npm-release/release-plan.json').packages.find(({ dir }) => dir === '$dir').name")
            version=$(node -p "require('./npm-release/release-plan.json').packages.find(({ dir }) => dir === '$dir').version")
            tarball=${name#@}
            tarball="npm-release/${tarball//\//-}-${version}.tgz"
            registry_state "$name" "$version"
            if [ "$REGISTRY_STATE" = exists ]; then
              remote_integrity=$(npm view "${name}@${version}" dist.integrity --registry "$NPM_REGISTRY")
              local_integrity=$(node -e "const fs=require('node:fs'),crypto=require('node:crypto'); console.log('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$tarball")
              if [ "$remote_integrity" != "$local_integrity" ]; then
                echo "Published ${name}@${version} differs from the audited tarball" >&2
                exit 1
              fi
              echo "${name}@${version} already published with matching integrity"
            else
              npm publish "./${tarball}" --access public --provenance --tag latest --registry "$NPM_REGISTRY"
            fi
          done
