name: Secret scan

on:
  pull_request:
    branches: [master, lowcode-rebaseline]
  push:
    branches: [master, lowcode-rebaseline]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
          no-cache: true

      - name: Verify the pinned Bun runtime
        run: test "$(bun --version)" = "1.3.10"

      - name: Scan current index and working-tree authorities
        run: bun --config=/dev/null --no-env-file --no-install tools/secret-scan/src/index.ts
