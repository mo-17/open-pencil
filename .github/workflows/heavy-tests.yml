name: Heavy tests

on:
  workflow_dispatch:
    inputs:
      group:
        description: Unit-test group to check (all for release verification)
        type: choice
        default: all
        options:
          - all
          - app
          - compiler
          - compiler-browser
          - dom
          - editor
          - fig
          - motion
          - render
          - scene
          - vue
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: heavy-tests-lowcode-rebaseline
  cancel-in-progress: true

jobs:
  fixture-heavy-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: lowcode-rebaseline

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Install motion export test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Build packages
        run: bun run build:packages

      - name: Heavy fixture unit tests
        shell: bash
        run: bun run test:unit:heavy "$TEST_GROUP"
        env:
          TEST_GROUP: ${{ inputs.group || 'all' }}
