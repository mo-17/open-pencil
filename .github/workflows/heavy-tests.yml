name: Heavy tests

on:
  workflow_dispatch:
    inputs:
      group:
        description: Unit-test group to check (all for release verification)
        type: choice
        default: all
        options:
          - all
          - app
          - compiler
          - compiler-browser
          - motion
          - lowcode
          - cli
          - core
          - dom
          - fig
          - mcp
          - render
          - scene-graph
          - vue
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: heavy-tests-lowcode-rebaseline
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Heavy and isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: lowcode-rebaseline

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Install motion export test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Build packages
        run: bun run build:packages

      - name: Heavy fixture unit tests
        shell: bash
        run: bun run test:unit:heavy "$TEST_GROUP"
        env:
          TEST_GROUP: ${{ inputs.group || 'all' }}
      # Fresh global object per file: a suite that only passes because an
      # earlier file initialized a codec, loaded a font or left a database
      # open fails here instead of flaking in a PR shard.
      - name: Quick unit tests with per-file isolation
        if: ${{ !cancelled() }}
        run: bun run test:unit:isolated
