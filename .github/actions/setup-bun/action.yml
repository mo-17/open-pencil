name: Setup Bun workspace

description: Check out-independent Bun setup, cache, optional LFS pull, and install.

inputs:
  install-args:
    description: Arguments passed to bun install.
    required: false
    default: --frozen-lockfile
  lfs:
    description: Pull Git LFS files before installing dependencies.
    required: false
    default: 'false'
  cache:
    description: Restore the Bun package cache before installing dependencies.
    required: false
    default: 'true'
  bun-download-url:
    description: Optional exact Bun release archive URL for a native runner.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Pull LFS files
      if: inputs.lfs == 'true'
      shell: bash
      run: |
        git lfs install --force
        git lfs pull
        head -c 4 tests/fixtures/material3.fig | xxd

    - uses: oven-sh/setup-bun@v2
      if: inputs.bun-download-url == ''
      with:
        bun-version: 1.3.10

    - uses: oven-sh/setup-bun@v2
      if: inputs.bun-download-url != ''
      with:
        bun-version: 1.3.10
        bun-download-url: ${{ inputs.bun-download-url }}

    - name: Verify exact Bun runtime
      shell: bash
      run: test "$(bun --version)" = "1.3.10"

    - uses: actions/cache@v6
      if: inputs.cache == 'true'
      with:
        path: ~/.bun/install/cache
        key: bun-1.3.10-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-1.3.10-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: bun install ${{ inputs.install-args }}
